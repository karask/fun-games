<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111c19">
  <title>Kingdom Defense · The Crystal Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div class="brand"><span class="brand-mark" aria-hidden="true">♜</span><div>Kingdom Defense<small>THE CRYSTAL WATCH</small></div></div>
    <div class="hud-stats">
      <div class="hud-stat"><span class="stat-icon life-icon" aria-hidden="true">♥</span><div><small>Crystal</small><strong id="hud-lives">20</strong></div></div>
      <div class="hud-stat"><span class="stat-icon gold-icon" aria-hidden="true">◈</span><div><small>Gold</small><strong id="hud-gold">200</strong></div></div>
      <div class="hud-stat"><span class="stat-icon" aria-hidden="true">⚑</span><div><small>Wave</small><strong id="hud-wave">1/5</strong></div></div>
    </div>
    <div class="hud-actions"><button id="btn-sound" class="quiet-btn" aria-label="Mute sound" aria-pressed="false">Sound on</button><button id="btn-pause" class="quiet-btn" aria-label="Pause game">Ⅱ Pause</button></div>
  </header>
  <section id="battlebar" aria-label="Wave controls">
    <button id="btn-scout" class="scout-button"><small id="wave-phase">PREPARE YOUR DEFENSE</small><span id="wave-summary">Scout the next wave <span aria-hidden="true">↗</span></span></button>
    <div class="battle-actions"><button id="btn-speed" class="quiet-btn" aria-label="Change game speed">1×</button><button id="btn-wave" class="primary-btn">Start wave →</button></div>
  </section>
  <main id="board">
    <canvas id="gameCanvas" tabindex="0" aria-label="Battlefield. Select towers with keys 1 to 5. Use arrow keys to choose a tile, Enter to place or inspect, and Escape to cancel."></canvas>
    <div class="map-caption"><span class="eyebrow">THE BORDERLANDS</span><span id="hud-level">The Misty Valley</span></div>
    <div class="camera-controls"><button id="btn-zoom-out" aria-label="Zoom out">−</button><button id="btn-zoom-in" aria-label="Zoom in">+</button><button id="btn-camera-reset" aria-label="Reset camera">⌖</button></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="boss-health" hidden><span id="boss-name"></span><div class="boss-track"><div id="boss-fill"></div></div><small id="boss-trait"></small></div>
  </main>
  <footer id="shop">
    <div class="shop-heading"><span class="eyebrow">YOUR DEFENSES</span><span class="keyboard-hint">1–5 select · arrows aim · Enter build · Esc cancel</span></div>
    <div class="shop-layout"><div id="tower-buttons" aria-label="Choose a tower"></div><div id="tower-info"></div></div>
  </footer>
  <div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Kingdom Defense menu"></div>
  <script src="levels.js"></script>
  <script src="entities.js"></script>
  <script src="art.js"></script>
  <script src="renderer.js"></script>
  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="controls.js"></script>
  <script src="game.js"></script>
</body>
</html>
